<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>endgrain</title>
<style>
  :root {
    --bg: #1d2629; --panel: #243034; --ink: #e9dfca; --muted: #9aa39f; --line: #34433f; --accent: #c9733f;
    --mono: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace;
    --sans: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  @media (prefers-color-scheme: light) {
    :root { --bg: #f4efe6; --panel: #ebe4d6; --ink: #1d2629; --muted: #5d6763; --line: #d6ccb9; --accent: #a95a2c; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.5 var(--sans); }
  main { max-width: 980px; margin: 0 auto; padding: 48px 16px 64px; }
  header { display: flex; align-items: baseline; gap: 16px; flex-wrap: wrap; margin-bottom: 32px; }
  h1 { font: 600 28px/1 var(--mono); margin: 0; letter-spacing: -0.02em; }
  header p { margin: 0; color: var(--muted); }
  .stage { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); gap: 40px; align-items: start; }
  .tree { aspect-ratio: 1; display: grid; place-items: center; }
  .tree svg { width: 100%; height: auto; }
  label { display: block; font: 12px var(--mono); color: var(--muted); text-transform: lowercase; margin: 0 0 6px; }
  .field { margin-bottom: 22px; }
  input[type=text], select {
    width: 100%; background: var(--panel); color: var(--ink); border: 1px solid var(--line);
    border-radius: 6px; padding: 10px 12px; font: 16px var(--mono);
  }
  input[type=text]:focus, select:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
  .seg { display: flex; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
  .seg button { flex: 1; background: var(--panel); color: var(--muted); border: 0; padding: 9px 0; font: 13px var(--mono); cursor: pointer; }
  .seg button + button { border-left: 1px solid var(--line); }
  .seg button[aria-pressed=true] { background: var(--accent); color: #fff8ee; }
  .age { display: flex; gap: 12px; align-items: center; }
  .age input[type=range] { flex: 1; accent-color: var(--accent); }
  .age output { font: 13px var(--mono); min-width: 5ch; text-align: right; }
  .age label { display: flex; gap: 6px; align-items: center; margin: 0; }
  blockquote { margin: 0 0 22px; padding: 12px 14px; border-left: 3px solid var(--accent); background: var(--panel); border-radius: 0 6px 6px 0; }
  .actions { display: flex; gap: 10px; flex-wrap: wrap; }
  .actions button { background: transparent; color: var(--ink); border: 1px solid var(--line); border-radius: 6px; padding: 9px 14px; font: 13px var(--mono); cursor: pointer; }
  .actions button:hover { border-color: var(--accent); }
  .meta { font: 12px var(--mono); color: var(--muted); margin-top: 10px; }
  h2 { font: 600 13px var(--mono); color: var(--muted); margin: 56px 0 16px; text-transform: lowercase; }
  .forest { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 18px; }
  .forest figure { margin: 0; cursor: pointer; }
  .forest svg { width: 100%; height: auto; display: block; }
  .forest figcaption { font: 12px var(--mono); color: var(--muted); text-align: center; margin-top: 6px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  footer { margin-top: 56px; color: var(--muted); font-size: 13px; }
  footer code { font-family: var(--mono); color: var(--ink); }
  @media (max-width: 720px) { .stage { grid-template-columns: 1fr; gap: 24px; } main { padding-top: 32px; } }
</style>
</head>
<body>
<main>
  <header>
    <h1>endgrain</h1>
    <p>Type anything. It grows into a tree, and this is the cut through its trunk.</p>
  </header>

  <section class="stage">
    <div class="tree" id="tree" aria-live="polite"></div>
    <div>
      <div class="field">
        <label for="seed">seed</label>
        <input type="text" id="seed" value="quietwright" autocomplete="off" spellcheck="false">
      </div>
      <div class="field">
        <label for="species">species</label>
        <select id="species"><option value="">from the seed</option></select>
      </div>
      <div class="field">
        <label>shape</label>
        <div class="seg" id="shape">
          <button type="button" data-v="log" aria-pressed="true">log</button>
          <button type="button" data-v="circle" aria-pressed="false">circle</button>
          <button type="button" data-v="square" aria-pressed="false">square</button>
        </div>
      </div>
      <div class="field">
        <label for="age">age</label>
        <div class="age">
          <label><input type="checkbox" id="auto" checked> from the seed</label>
          <input type="range" id="age" min="3" max="120" value="24" disabled>
          <output id="ageOut">24 y</output>
        </div>
      </div>
      <blockquote id="desc"></blockquote>
      <div class="actions">
        <button type="button" id="download">download .svg</button>
        <button type="button" id="copy">copy svg</button>
        <button type="button" id="random">another seed</button>
      </div>
      <div class="meta" id="meta"></div>
    </div>
  </section>

  <h2>the same seed, every species</h2>
  <div class="forest" id="species-row"></div>

  <h2>a stand of neighbours</h2>
  <div class="forest" id="neighbours"></div>

  <footer>
    <p>No network, no dependencies. In your own code: <code>import { endgrain } from 'endgrain'</code> and <code>endgrain('your seed')</code>.</p>
  </footer>
</main>

<script>
/*__ENDGRAIN__*/

const $ = (id) => document.getElementById(id)
const state = { shape: 'log' }
for (const name of Object.keys(SPECIES)) $('species').add(new Option(name, name))

const WORDS = ['ember', 'harbor', 'linden', 'moss', 'quarry', 'saltmarsh', 'tinder', 'vellum', 'whittle', 'yarrow', 'adze', 'burl', 'kerf', 'mortise', 'tenon', 'spoke']

function options() {
  return {
    species: $('species').value || undefined,
    age: $('auto').checked ? undefined : Number($('age').value),
    shape: state.shape,
  }
}

function figure(seed, opts, caption) {
  const f = document.createElement('figure')
  f.innerHTML = endgrain(seed, { ...opts, size: 160 }) + `<figcaption></figcaption>`
  f.querySelector('figcaption').textContent = caption
  f.title = describe(grow(seed, opts))
  return f
}

function draw() {
  const seed = $('seed').value
  const opts = options()
  const svg = endgrain(seed, { ...opts, size: 512 })
  $('tree').innerHTML = svg
  const tree = grow(seed, opts)
  $('desc').textContent = describe(tree)
  if ($('auto').checked) { $('age').value = tree.age }
  $('ageOut').textContent = `${$('age').value} y`
  $('meta').textContent = `${(svg.length / 1024).toFixed(1)} KB · ${tree.rings.length} rings · heartwood from year ${tree.heartYear}`

  const row = $('species-row'); row.replaceChildren()
  for (const name of Object.keys(SPECIES)) {
    const f = figure(seed, { ...opts, species: name }, name)
    f.onclick = () => { $('species').value = name; draw() }
    row.append(f)
  }
  const near = $('neighbours'); near.replaceChildren()
  const base = seed || 'tree'
  for (const s of [base + '!', base.toUpperCase(), base + ' ', base + '2', base.split('').reverse().join(''), 'a ' + base]) {
    const f = figure(s, { shape: opts.shape }, JSON.stringify(s))
    f.onclick = () => { $('seed').value = s; draw() }
    near.append(f)
  }
}

$('seed').addEventListener('input', draw)
$('species').addEventListener('change', draw)
$('auto').addEventListener('change', () => { $('age').disabled = $('auto').checked; draw() })
$('age').addEventListener('input', draw)
$('shape').addEventListener('click', (e) => {
  const b = e.target.closest('button'); if (!b) return
  state.shape = b.dataset.v
  for (const x of $('shape').children) x.setAttribute('aria-pressed', String(x === b))
  draw()
})
$('random').addEventListener('click', () => {
  const w = () => WORDS[Math.floor(Math.random() * WORDS.length)]
  $('seed').value = `${w()}-${w()}`
  draw()
})
$('download').addEventListener('click', () => {
  const blob = new Blob([endgrain($('seed').value, { ...options(), size: 512 })], { type: 'image/svg+xml' })
  const a = document.createElement('a')
  a.href = URL.createObjectURL(blob)
  a.download = `${($('seed').value || 'endgrain').replace(/[^\w-]+/g, '_')}.svg`
  a.click()
  setTimeout(() => URL.revokeObjectURL(a.href), 1000)
})
$('copy').addEventListener('click', async () => {
  try {
    await navigator.clipboard.writeText(endgrain($('seed').value, { ...options(), size: 512 }))
    $('copy').textContent = 'copied'
  } catch { $('copy').textContent = 'copy blocked' }
  setTimeout(() => { $('copy').textContent = 'copy svg' }, 1400)
})
draw()
</script>
</body>
</html>
